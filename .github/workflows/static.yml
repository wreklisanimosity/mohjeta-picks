# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # fix609: re-try a failed publish every 20 min (GitHub Pages outage, Nov 25 2026)
  schedule:
    - cron: "*/20 * * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # fix609: on the 20-minute timer, publish again only if the newest commit has not been published yet
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/static.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.total_count')
          echo "successful publishes of this commit: $ok"
          if [ "${ok:-0}" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  # Single deploy job since we're just deploying
  deploy:
    needs: check
    if: needs.check.outputs.go == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Let frequent snapshot commits accumulate; publish the newest main below.
      - name: Batch incoming snapshots
        run: sleep 120
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: first_deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 1500000   # wait up to 25 min for GitHub (the 10 min default timed out on slow days)

      # A previous Pages deployment can remain active after its Actions run ends.
      # Retry once after a cooling-off period, then surface a real failure.
      - name: Wait before retrying deployment
        if: steps.first_deployment.outcome == 'failure'
        run: sleep 60
      - name: Retry GitHub Pages deployment
        if: steps.first_deployment.outcome == 'failure'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1500000
